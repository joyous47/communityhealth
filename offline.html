<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - CHMEWS</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0077cc, #005599);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 400px;
        }
        .icon {
            font-size: 4rem;
            color: #0077cc;
            margin-bottom: 20px;
        }
        h1 {
            color: #333;
            margin: 0 0 15px;
            font-size: 1.8rem;
        }
        p {
            color: #666;
            line-height: 1.6;
            margin: 0 0 25px;
        }
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: #0077cc;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: background 0.3s;
        }
        .btn:hover {
            background: #005599;
        }
        .status {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
        }
        .status.online {
            background: #e8f5e9;
            color: #2e7d32;
        }
        .status.offline {
            background: #ffebee;
            color: #c62828;
        }
        .pending-reports {
            margin-top: 20px;
            text-align: left;
        }
        .pending-reports h3 {
            color: #333;
            margin-bottom: 10px;
        }
        .report-item {
            padding: 10px;
            background: #f5f5f5;
            border-radius: 5px;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📡</div>
        <h1>You're Offline</h1>
        <p>It looks like you've lost your internet connection. Don't worry - you can still submit reports and they'll be synced when you're back online.</p>
        
        <div id="connectionStatus" class="status offline">
            <span>●</span> No internet connection
        </div>
        
        <div class="pending-reports" id="pendingReports" style="display: none;">
            <h3>Pending Reports (<span id="pendingCount">0</span>)</h3>
            <div id="reportsList"></div>
        </div>
        
        <br>
        <a href="index.php" class="btn">Try Again</a>
    </div>
    
    <script>
        
        function updateOnlineStatus() {
            const statusEl = document.getElementById('connectionStatus');
            if (navigator.onLine) {
                statusEl.className = 'status online';
                statusEl.innerHTML = '<span>✓</span> Back online! Syncing pending reports...';
                syncReports();
            } else {
                statusEl.className = 'status offline';
                statusEl.innerHTML = '<span>●</span> No internet connection';
            }
        }
        
    
        async function loadPendingReports() {
            try {
                const request = indexedDB.open('chmews_offline', 1);
                request.onsuccess = () => {
                    const db = request.result;
                    const tx = db.transaction('pending_reports', 'readonly');
                    const store = tx.objectStore('pending_reports');
                    const getAll = store.getAll();
                    getAll.onsuccess = () => {
                        const reports = getAll.result;
                        const container = document.getElementById('pendingReports');
                        const countEl = document.getElementById('pendingCount');
                        const listEl = document.getElementById('reportsList');
                        
                        if (reports.length > 0) {
                            container.style.display = 'block';
                            countEl.textContent = reports.length;
                            listEl.innerHTML = reports.map(r => 
                                `<div class="report-item">${r.symptoms || 'Health Report'} - ${new Date(r.timestamp).toLocaleString()}</div>`
                            ).join('');
                        }
                    };
                };
            } catch (e) {
                console.error('Error loading pending reports:', e);
            }
        }
        

        async function syncReports() {
            try {
                const request = indexedDB.open('chmews_offline', 1);
                request.onsuccess = () => {
                    const db = request.result;
                    const tx = db.transaction('pending_reports', 'readonly');
                    const store = tx.objectStore('pending_reports');
                    const getAll = store.getAll();
                    getAll.onsuccess = async () => {
                        const reports = getAll.result;
                        for (const report of reports) {
                            try {
                                const response = await fetch('/api/sync_report.php', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify(report)
                                });
                                if (response.ok) {
                                    const deleteTx = db.transaction('pending_reports', 'readwrite');
                                    deleteTx.objectStore('pending_reports').delete(report.id);
                                }
                            } catch (e) {
                                console.log('Sync failed, will retry later');
                            }
                        }
                        
                        setTimeout(loadPendingReports, 1000);
                    };
                };
            } catch (e) {
                console.error('Error syncing:', e);
            }
        }
        
    
        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);
        
    
        updateOnlineStatus();
        loadPendingReports();
        
    
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.addEventListener('message', (event) => {
                if (event.data.type === 'REPORT_SYNCED') {
                    loadPendingReports();
                }
            });
        }
    </script>
</body>
</html>
